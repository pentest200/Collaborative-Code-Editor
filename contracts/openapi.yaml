openapi: 3.1.0
info:
  title: Collaborative Code Editor API contract
  version: 0.1.0
  description: >-
    Phases 00–06 implement health, identity, projects, memberships, file-tree metadata, durable realtime collaboration, and private immutable checkpoints with owner-only restore.
    Runs and versioned search are implemented. See checkpoints.md and search.md for artifact, generation and freshness contracts.
servers:
  - url: /
    description: Same origin through web reverse proxy
tags:
  - name: foundation
  - name: identity
  - name: projects
  - name: tree
  - name: checkpoints
  - name: runs
  - name: search
paths:
  /api/v1/healthz:
    get:
      tags: [foundation]
      summary: Process liveness (Phase 03)
      responses:
        '200':
          description: Process is serving HTTP; does not assert database readiness
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, service, phase]
                properties:
                  status: { const: ok }
                  service: { const: api }
                  phase: { const: '03' }
  /api/v1/auth/github/start:
    get:
      tags: [identity]
      x-implementation-phase: '01'
      summary: Begin GitHub.com OAuth with one-use state and PKCE
      responses:
        '302': { description: Redirect to GitHub authorization endpoint }
  /api/v1/auth/config:
    get:
      tags: [identity]
      x-implementation-phase: '01'
      summary: Public login availability without exposing credentials
      responses:
        '200':
          description: GitHub sign-in configuration state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [github_enabled, execution_enabled, workspace_enabled]
                properties:
                  github_enabled: { type: boolean }
                  execution_enabled: { type: boolean, description: Explicitly configured restricted private-demo execution }
                  workspace_enabled: { type: boolean, description: Explicitly configured private persistent development environments }
  /api/v1/auth/github/callback:
    get:
      tags: [identity]
      x-implementation-phase: '01'
      summary: Exact OAuth callback; issue HttpOnly app session
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: iss, in: query, required: false, schema: { type: string, enum: ["https://github.com/login/oauth"] }, description: Optional authorization-server issuer; incorrect or duplicate values are rejected. }
      responses:
        '302': { description: Authenticated redirect }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/session:
    get:
      tags: [identity]
      x-implementation-phase: '01'
      summary: Get current authenticated user and CSRF token
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user, csrf_token]
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  csrf_token: { type: string }
        '401': { $ref: '#/components/responses/Error' }
    delete:
      tags: [identity]
      x-implementation-phase: '01'
      summary: Revoke current session and clear cookie
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '204': { description: Logged out }
  /api/v1/projects:
    get:
      tags: [projects]
      x-implementation-phase: '01'
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Projects visible to user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }
    post:
      tags: [projects]
      x-implementation-phase: '01'
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/projects/{project_id}:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [projects]
      x-implementation-phase: '01'
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '403': { $ref: '#/components/responses/Error' }
    delete:
      tags: [projects]
      x-implementation-phase: '01'
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '204': { description: Deleted by owner }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/projects/{project_id}/members:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [projects]
      x-implementation-phase: '01'
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Authorized member list }
  /api/v1/projects/{project_id}/members/{user_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [projects]
      x-implementation-phase: '01'
      summary: Owner changes editor/viewer role
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { type: string, enum: [editor, viewer] }
      responses:
        '200': { description: Updated member }
        '403': { $ref: '#/components/responses/Error' }
    delete:
      tags: [projects]
      x-implementation-phase: '01'
      summary: Owner revokes member
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '204': { description: Revoked }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/projects/{project_id}/invites:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      tags: [projects]
      x-implementation-phase: '01'
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role, expires_at, max_uses]
              properties:
                role: { type: string, enum: [editor, viewer] }
                expires_at: { type: string, format: date-time }
                max_uses: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '201': { description: One-time plaintext invite token returned to owner }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/projects/{project_id}/invites/{invite_id}:
    delete:
      tags: [projects]
      x-implementation-phase: '01'
      summary: Owner revokes an invitation
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { name: invite_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Invitation revoked }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/invites/{token}/accept:
    post:
      tags: [projects]
      x-implementation-phase: '01'
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Membership accepted transactionally }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/projects/{project_id}/tree:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [tree]
      x-implementation-phase: '02'
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Active tree with decimal tree_version and event_sequence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tree' }
    post:
      tags: [tree]
      x-implementation-phase: '02'
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTreeEntry' }
      responses:
        '201':
          description: Created file/folder and initial Yjs document snapshot for a file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreeMutation' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/Error' }
  /api/v1/projects/{project_id}/tree/{file_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/FileId' }
    patch:
      tags: [tree]
      x-implementation-phase: '02'
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                parent_id: { type: [string, 'null'], format: uuid }
      responses:
        '200':
          description: Renamed/moved entry and new version; file and document identity are preserved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreeMutation' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/Error' }
    delete:
      tags: [tree]
      x-implementation-phase: '02'
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '204': { description: Bounded subtree tombstoned; new version in ETag header }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/Error' }
  /api/v1/projects/{project_id}/checkpoints:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [checkpoints]
      x-implementation-phase: '06'
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Latest 100 authorized checkpoints and actual materialization states
          content:
            application/json:
              schema:
                type: object
                required: [checkpoints]
                properties:
                  checkpoints: { type: array, items: { $ref: '#/components/schemas/Checkpoint' } }
    post:
      tags: [checkpoints]
      x-implementation-phase: '06'
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '202':
          description: Captured committed checkpoint cut; background materialization pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checkpoint' }
        '401': { description: Session required }
        '403': { description: Owner/editor and CSRF/Origin required }
        '503': { description: Capture storage failure }
  /api/v1/projects/{project_id}/checkpoints/{checkpoint_id}:
    get:
      tags: [checkpoints]
      x-implementation-phase: '06'
      summary: Preview authorized ready checkpoint manifest and file cut
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { name: checkpoint_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Canonical checksum-verified ready manifest; see checkpoints.md }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { description: Checkpoint missing or outside current project membership }
        '503': { description: Manifest verification or storage failure }
  /api/v1/projects/{project_id}/checkpoints/{checkpoint_id}/files/{file_id}:
    get:
      tags: [checkpoints]
      x-implementation-phase: '06'
      summary: Download verified captured text or original file bytes under current membership
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { name: checkpoint_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/FileId' }
      responses:
        '200':
          description: Checksum-verified scoped text attachment, never a public storage URL
          content:
            text/plain:
              schema: { type: string }
        '404': { description: Missing file/checkpoint or current access denied }
        '409': { description: Checkpoint is incomplete }
        '503': { description: File or manifest verification/storage failure }
  /api/v1/projects/{project_id}/checkpoints/{checkpoint_id}/retry:
    post:
      tags: [checkpoints]
      x-implementation-phase: '06'
      summary: Owner/editor retries a failed materialization from its original captured cut
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { name: checkpoint_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202': { description: Original checkpoint returned to captured with durable job pending }
        '403': { description: Owner/editor and CSRF/Origin required }
        '409': { description: Only failed checkpoints can be retried }
  /api/v1/projects/{project_id}/checkpoints/{checkpoint_id}/restore:
    post:
      tags: [checkpoints]
      x-implementation-phase: '06'
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { name: checkpoint_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200': { description: Atomically replaced tree with fresh generations; tree_version and previous_checkpoint_id/previous_checkpoint_name returned. Previous cut is durably captured and materialization pending. }
        '409': { $ref: '#/components/responses/Conflict' }
        '403': { description: Current owner and CSRF/Origin required }
        '428': { description: Decimal If-Match tree version required }
        '503': { description: Preparation or replacement failed; refresh to resolve any ambiguous completion }
  /api/v1/projects/{project_id}/runs:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      tags: [runs]
      x-implementation-phase: '07'
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [runtime, entrypoint, stdin]
              properties:
                runtime: { type: string, enum: [python, javascript] }
                entrypoint: { type: string, minLength: 1, maxLength: 1024 }
                stdin: { type: string, maxLength: 16384 }
      responses:
        '202': { description: Capturing immutable input or replaying the original identical idempotent request }
        '400': { description: Invalid runtime/manifest path or stdin exceeds 16 KiB UTF-8 }
        '409': { description: Idempotency key already used with different input }
        '429': { description: One active job per user and per project }
        '503': { description: Execution not configured or durable capture unavailable }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/projects/{project_id}/runs/{run_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { name: run_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [runs]
      x-implementation-phase: '07'
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Authorized immutable input checkpoint, status and exit metadata, content: { application/json: { schema: { $ref: '#/components/schemas/Run' } } } }
    delete:
      tags: [runs]
      x-implementation-phase: '07'
      summary: Owner/editor requests cancellation; terminal jobs remain terminal
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '202': { description: Cancellation requested }
  /api/v1/projects/{project_id}/runs/{run_id}/events:
    get:
      tags: [runs]
      x-implementation-phase: '07'
      summary: Authorized ordered output/status stream with resumable sequence
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { name: run_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: after, in: query, required: false, schema: { $ref: '#/components/schemas/DecimalSequence' } }
      responses:
        '200':
          description: SSE events with decimal IDs and bounded stdout/stderr/status payloads; after or Last-Event-ID resumes; current membership/session rechecked every 500ms; streams rotate after 30s
          content:
            text/event-stream:
              schema: { type: string }
  /api/v1/projects/{project_id}/search:
    get:
      tags: [search]
      x-implementation-phase: '08'
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { name: q, in: query, required: true, description: Case-insensitive literal substring of 1–128 UTF-8 bytes after trimming; no control characters, regex or query syntax., schema: { type: string, minLength: 1, maxLength: 128 } }
      responses:
        '200':
          description: Versioned authorized results; may lag committed edits
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [results, truncated, freshness]
                properties:
                  results:
                    type: array
                    maxItems: 50
                    items: { $ref: '#/components/schemas/SearchResult' }
                  truncated: { type: boolean }
                  freshness: { type: string }
        '400': { description: Invalid query or duplicate/unknown query keys }
        '401': { description: Session required or expired }
        '404': { description: Project missing or membership removed }
        '503': { description: Database unavailable or query deadline exceeded }
  /api/v1/projects/{project_id}/import:
    post:
      summary: Atomically import any file type and implied folders without overwriting
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                parent_id: { type: [string, 'null'], format: uuid }
                files:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [path]
                    oneOf:
                      - { required: [text], not: { required: [data_base64] } }
                      - { required: [data_base64], not: { required: [text] } }
                    properties:
                      path: { type: string, description: Relative path; folders inferred }
                      text: { type: string, description: UTF-8 text up to 256 KiB; no NUL }
                      data_base64: { type: string, contentEncoding: base64, description: Original bytes of any format up to 25 MiB; binary and large text files remain immutable assets }
      responses:
        '201': { description: All selected files created atomically as collaborative documents or immutable original-byte assets }
        '400': { description: Invalid files or tree limits }
        '403': { description: Editor permission or CSRF required }
        '409': { description: Tree version, name or source quota conflict; no partial import }
  /api/v1/projects/{project_id}/files/{file_id}/asset:
    get:
      summary: Download an original asset under current project and session access
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { name: file_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: preview, in: query, required: false, schema: { type: string, enum: ['1'] }, description: Inline preview only for PNG/JPEG/GIF/WebP; other formats remain attachments }
      responses:
        '200': { description: Checksum-verified original bytes; no-store, nosniff, sandbox CSP and safe Content-Disposition filename }
        '404': { description: File not found or membership absent }
  /api/v1/projects/{project_id}/workspace:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      summary: Read development environment configuration and last task logs
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Environment state/configuration/checkpoint/task/terminal count }
        '503': { description: Private workspaces unavailable }
    put:
      summary: Create/start/save configuration or stop the environment
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, language, root, entrypoint]
              properties:
                action: { type: string, enum: [start, stop] }
                language: { type: string, enum: [python, node, typescript, cpp, java, go] }
                root: { type: string, description: Relative project folder or . }
                entrypoint: { type: string, description: Relative source file or Java main class; Go also accepts . }
      responses:
        '200': { description: Editor-authorized lifecycle action applied }
        '409': { description: Configuration change blocked by active task or terminals }
    delete:
      summary: Owner-only deletion of environment and its volume; retain collaborative source
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Environment storage removed }
        '403': { description: Owner permission required }
        '409': { description: Active task or terminals must close first }
  /api/v1/projects/{project_id}/workspace/sync:
    post:
      summary: Replace workspace working source with a verified ready checkpoint
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checkpoint_id]
              properties:
                checkpoint_id: { type: string, format: uuid }
      responses:
        '200': { description: Working source replaced; retained dependencies and home preserved }
        '409': { description: Checkpoint not ready or task/terminal active }
  /api/v1/projects/{project_id}/workspace/tasks:
    post:
      summary: Start one bounded install/build/run task in the configured workspace
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [install, build, run] }
      responses:
        '202': { description: Task started; status/logs available through workspace GET }
        '409': { description: Task/terminal already active or source not synced }
  /ws/workspaces/{project_id}/terminal:
    get:
      summary: Independent bounded PTY shell with two-second session/editor revalidation
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
      responses:
        '101': { description: Binary shell output/text shell input WebSocket; strict Origin required }
        '403': { description: Editor permission or allowed Origin required }
        '409': { description: Environment/terminal unavailable }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: cce_session }
    csrfHeader: { type: apiKey, in: header, name: X-CSRF-Token }
  parameters:
    ProjectId: { name: project_id, in: path, required: true, schema: { type: string, format: uuid } }
    FileId: { name: file_id, in: path, required: true, schema: { type: string, format: uuid } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { $ref: '#/components/schemas/DecimalSequence' } }
  schemas:
    DecimalSequence: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
    Checkpoint:
      type: object
      additionalProperties: false
      required: [id, project_id, creator_id, name, state, captured_tree_version, created_at, failure_code]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        creator_id: { type: string, format: uuid }
        name: { type: string }
        state: { type: string, enum: [captured, materializing, ready, failed] }
        captured_tree_version: { $ref: '#/components/schemas/DecimalSequence' }
        created_at: { type: string, format: date-time }
        failure_code: { type: [string, 'null'] }
    Run:
      type: object
      additionalProperties: false
      required: [id, project_id, checkpoint_id, runtime, entrypoint, state, attempt, event_sequence, cancel_requested, truncated, exit_code, failure_code]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        checkpoint_id: { type: string, format: uuid }
        runtime: { type: string, enum: [python, javascript] }
        entrypoint: { type: string }
        state: { type: string, enum: [capturing, queued, running, succeeded, failed, timed_out, cancelled] }
        attempt: { type: integer, minimum: 0 }
        event_sequence: { $ref: '#/components/schemas/DecimalSequence' }
        cancel_requested: { type: boolean }
        truncated: { type: boolean }
        exit_code: { type: [integer, 'null'] }
        failure_code: { type: [string, 'null'] }
    User:
      type: object
      additionalProperties: false
      required: [id, display_name]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
    Project:
      type: object
      additionalProperties: false
      required: [id, name, role, tree_version, event_sequence]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [owner, editor, viewer] }
        tree_version: { $ref: '#/components/schemas/DecimalSequence' }
        event_sequence: { $ref: '#/components/schemas/DecimalSequence' }
    CreateTreeEntry:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind: { type: string, enum: [file, folder] }
        name: { type: string, minLength: 1, maxLength: 255 }
        parent_id: { type: [string, 'null'], format: uuid }
        language: { type: string }
    TreeEntry:
      type: object
      additionalProperties: false
      required: [id, parent_id, name, kind, language, document_id, generation]
      properties:
        storage_kind: { type: string, enum: [asset], description: Present only for original-byte assets; absent for collaborative text }
        byte_size: { type: integer, minimum: 0, maximum: 26214400 }
        media_type: { type: string, description: Server-detected content type for assets }
        id: { type: string, format: uuid }
        parent_id: { type: [string, 'null'], format: uuid }
        name: { type: string, minLength: 1, maxLength: 255 }
        kind: { type: string, enum: [file, folder] }
        language: { type: [string, 'null'] }
        document_id: { type: [string, 'null'], format: uuid }
        generation: { $ref: '#/components/schemas/DecimalSequence' }
    Tree:
      type: object
      additionalProperties: false
      required: [tree_version, event_sequence, entries]
      properties:
        tree_version: { $ref: '#/components/schemas/DecimalSequence' }
        event_sequence: { $ref: '#/components/schemas/DecimalSequence' }
        entries:
          type: array
          items: { $ref: '#/components/schemas/TreeEntry' }
    TreeMutation:
      type: object
      additionalProperties: false
      required: [entry, tree_version, event_sequence]
      properties:
        entry: { $ref: '#/components/schemas/TreeEntry' }
        tree_version: { $ref: '#/components/schemas/DecimalSequence' }
        event_sequence: { $ref: '#/components/schemas/DecimalSequence' }
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        current_version: { $ref: '#/components/schemas/DecimalSequence' }
    SearchResult:
      type: object
      additionalProperties: false
      required: [project_id, file_id, document_id, generation, indexed_sequence, current_sequence, stale, filename_match, path, snippet]
      properties:
        project_id: { type: string, format: uuid }
        file_id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        generation: { $ref: '#/components/schemas/DecimalSequence' }
        indexed_sequence: { type: [string, 'null'], pattern: '^(0|[1-9][0-9]*)$' }
        current_sequence: { $ref: '#/components/schemas/DecimalSequence' }
        stale: { type: boolean }
        filename_match: { type: boolean }
        path: { type: string }
        snippet: { type: [string, 'null'], maxLength: 240 }
  responses:
    Error:
      description: Typed safe error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Stale version or conflicting operation; includes current_version
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
