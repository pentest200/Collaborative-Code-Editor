# Optional local operator tooling. Metrics and OTLP have no public edge route.
services:
  api:
    environment:
      METRICS_LISTEN_ADDR: 0.0.0.0:9091
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      CCE_TRACE_SAMPLE_RATIO: "1"
    expose: ["9091"]
  jobs:
    environment:
      METRICS_LISTEN_ADDR: 0.0.0.0:9091
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      CCE_TRACE_SAMPLE_RATIO: "1"
    expose: ["9091"]
  collab:
    environment:
      METRICS_PORT: "9091"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      CCE_TRACE_SAMPLE_RATIO: "1"
    expose: ["9091"]
  otel-collector:
    image: otel/opentelemetry-collector:0.160.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["../observability/collector.yaml:/etc/otel/config.yaml:ro"]
    networks: [private]
    mem_limit: 256m
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  prometheus:
    image: prom/prometheus:v3.14.0
    command: ["--config.file=/etc/prometheus/prometheus.yaml", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=512MB"]
    volumes:
      - ../observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ../observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - metrics:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [private, public]
    mem_limit: 512m
  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: cce_operator
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set a local operator password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports: ["127.0.0.1:3001:3000"]
    volumes:
      - ../observability/provisioning:/etc/grafana/provisioning:ro
      - ../observability/dashboards:/var/lib/grafana/dashboards:ro
      - dashboards:/var/lib/grafana
    networks: [private, public]
    mem_limit: 512m
volumes:
  metrics: {}
  dashboards: {}
