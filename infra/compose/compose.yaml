name: collaborative-code-editor
services:
  edge:
    image: caddy:2.10-alpine
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    networks: [public]

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_ORIGIN: http://api:8080
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [public]

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    environment:
      APP_ENV: development
      PUBLIC_ORIGIN: http://localhost:3000
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      API_LISTEN_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://cce:cce_dev_only@postgres:5432/cce?sslmode=disable
      REDIS_ADDR: redis:6379
      COLLAB_INTERNAL_ORIGIN: http://collab:8081
      COLLAB_INTERNAL_TOKEN: ${COLLAB_INTERNAL_TOKEN:-cce_dev_internal_only}
      ARTIFACT_ENDPOINT: http://minio:9000
      ARTIFACT_ACCESS_KEY: ${MINIO_ROOT_USER:-cce_local_storage}
      ARTIFACT_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-cce_local_storage_only}
      ARTIFACT_BUCKET: cce-checkpoints
    expose: ["8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      collab: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [public, private]

  collab:
    build:
      context: ../..
      dockerfile: services/collab/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "8081"
      DATABASE_URL: postgres://cce_worker:cce_worker_dev_only@postgres:5432/cce?sslmode=disable
      COLLAB_INTERNAL_TOKEN: ${COLLAB_INTERNAL_TOKEN:-cce_dev_internal_only}
    expose: ["8081"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/internal/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  jobs:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    environment:
      APP_ENV: development
      JOBS_ONLY: "true"
      DATABASE_URL: postgres://cce:cce_dev_only@postgres:5432/cce?sslmode=disable
      COLLAB_INTERNAL_ORIGIN: http://collab:8081
      COLLAB_INTERNAL_TOKEN: ${COLLAB_INTERNAL_TOKEN:-cce_dev_internal_only}
      ARTIFACT_ENDPOINT: http://minio:9000
      ARTIFACT_ACCESS_KEY: ${MINIO_ROOT_USER:-cce_local_storage}
      ARTIFACT_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-cce_local_storage_only}
      ARTIFACT_BUCKET: cce-checkpoints
    depends_on:
      postgres: { condition: service_healthy }
      collab: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [private]

  minio:
    build:
      context: ../..
      dockerfile: infra/compose/Minio.Dockerfile
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cce_local_storage}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cce_local_storage_only}
    volumes: ["artifacts:/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [private]

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: cce
      POSTGRES_PASSWORD: cce_dev_only
      POSTGRES_DB: cce
    volumes:
      - pgdata:/var/lib/postgresql
      - ../../db/migrations:/canonical-migrations:ro
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/0000_init.sh:ro
      - ./0099_collab_login.sql:/local-collab-login.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cce -d cce"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

networks:
  public: {}
  private:
    internal: true
volumes:
  pgdata: {}
  artifacts: {}
